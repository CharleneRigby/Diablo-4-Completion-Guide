<!--
  Diablo IV — 100% Completion Path Checklist (PROTOTYPE v2 — atomic format)
  One named item per line: Quest / Side Quest / Waypoint / Dungeon / Stronghold / Altar / Boss / Area.
  Scope: Prologue + Act I (Fractured Peaks). Verified content only; gaps flagged.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#0c0a09; --panel:#1a1512; --panel2:#211a16;
    --ink:#ddccae; --ink-dim:#9a8769; --ink-faint:#6c5d49;
    --blood:#a8211c; --blood-deep:#6e1310; --ember:#c8842e;
    --line:rgba(200,160,110,.14); --line-strong:rgba(200,160,110,.28);
    --done:#7fa06a; --shadow:0 18px 40px -20px rgba(0,0,0,.9);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  /* hide scrollbar but keep scrolling */
  html{scrollbar-width:none;-ms-overflow-style:none}
  html::-webkit-scrollbar,body::-webkit-scrollbar,*::-webkit-scrollbar{width:0;height:0;display:none}
  body{
    font-family:"Plus Jakarta Sans",system-ui,-apple-system,sans-serif; color:var(--ink); background:var(--bg);
    background-image:
      radial-gradient(1200px 600px at 50% -10%, rgba(168,33,28,.10), transparent 60%),
      radial-gradient(900px 500px at 100% 100%, rgba(200,132,46,.06), transparent 60%),
      linear-gradient(180deg,#0c0a09,#0a0807);
    background-attachment:fixed; line-height:1.5; padding:0 0 80px;
  }
  .wrap{max-width:860px;margin:0 auto;padding:0 18px}

  header{position:sticky;top:0;z-index:20;
    background:linear-gradient(180deg,rgba(12,10,9,.97),rgba(12,10,9,.86));
    backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
  .hbar{max-width:860px;margin:0 auto;padding:16px 18px 12px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
  h1{font-family:"Plus Jakarta Sans",system-ui,-apple-system,sans-serif;font-weight:700;letter-spacing:.06em;font-size:clamp(20px,3.6vw,30px);margin:0;
    text-shadow:0 0 22px rgba(168,33,28,.35)}
  h1 .sub{display:block;font-weight:400;font-style:italic;font-size:13px;color:var(--ink-dim);margin-top:3px;font-family:"Plus Jakarta Sans",system-ui,-apple-system,sans-serif}
  .save{font-size:12.5px;letter-spacing:.05em;color:var(--ink-faint);white-space:nowrap;display:flex;align-items:center;gap:7px}
  .save .dot{width:7px;height:7px;border-radius:50%;background:var(--ink-faint);transition:.3s}
  .save.ok .dot{background:var(--done);box-shadow:0 0 9px var(--done)}
  .save.busy .dot{background:var(--ember);box-shadow:0 0 9px var(--ember)}
  .hbar-right{display:flex;align-items:center;gap:14px}
  .menu-wrap{position:relative}
  .ham{display:flex;flex-direction:column;justify-content:center;gap:4px;width:40px;height:34px;padding:0 10px;background:var(--panel);border:1px solid var(--line-strong);border-radius:8px;cursor:pointer;transition:.18s}
  .ham:hover{border-color:var(--ember)}
  .ham span{display:block;height:2px;border-radius:2px;background:var(--ink-dim);transition:.2s}
  .ham:hover span{background:var(--ink)}
  .ham.on span:nth-child(1){transform:translateY(6px) rotate(45deg)}
  .ham.on span:nth-child(2){opacity:0}
  .ham.on span:nth-child(3){transform:translateY(-6px) rotate(-45deg)}
  .menu{position:absolute;top:calc(100% + 8px);right:0;min-width:184px;background:var(--panel2);border:1px solid var(--line-strong);border-radius:10px;box-shadow:var(--shadow);padding:6px;z-index:40;display:flex;flex-direction:column;gap:2px}
  .menu[hidden]{display:none}
  .menu-item{font-family:"Plus Jakarta Sans",system-ui,-apple-system,sans-serif;text-align:left;font-size:13.5px;letter-spacing:.03em;color:var(--ink-dim);background:transparent;border:0;border-radius:7px;padding:10px 12px;cursor:pointer;transition:.15s}
  .menu-item:hover{color:var(--ink);background:var(--panel)}
  .menu-item.danger{color:#c9756f;margin-top:2px;border-top:1px solid var(--line)}
  .menu-item.danger:hover{color:#fff;background:rgba(168,33,28,.18)}

  .overall{max-width:860px;margin:0 auto;padding:0 18px 12px}
  .obar{height:9px;border-radius:6px;background:#000;border:1px solid var(--line);overflow:hidden}
  .ofill{height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,var(--blood-deep),var(--blood) 55%,var(--ember));box-shadow:0 0 16px rgba(168,33,28,.5);transition:width .5s cubic-bezier(.2,.7,.2,1)}
  .ometa{display:flex;justify-content:space-between;margin-top:6px;font-size:12.5px;color:var(--ink-dim);letter-spacing:.03em}

  .tools{max-width:860px;margin:0 auto;padding:0 18px 8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .btn{font-family:"Plus Jakarta Sans",system-ui,-apple-system,sans-serif;font-size:13px;letter-spacing:.04em;color:var(--ink-dim);background:var(--panel);border:1px solid var(--line-strong);border-radius:7px;padding:6px 12px;cursor:pointer;transition:.18s}
  .btn:hover{color:var(--ink);border-color:var(--ember);background:var(--panel2)}
  .btn.danger:hover{color:#fff;border-color:var(--blood);background:rgba(168,33,28,.18)}
  .btn.on{color:var(--ink);border-color:var(--ember)}
  .legend{max-width:860px;margin:0 auto;padding:0 18px 12px;font-size:12.5px;color:var(--ink-faint);font-style:italic}
  .tabs{max-width:860px;margin:0 auto;padding:8px 18px 10px;display:flex;gap:8px;flex-wrap:wrap}
  .tab{font-family:"Plus Jakarta Sans",system-ui,-apple-system,sans-serif;font-size:13.5px;letter-spacing:.04em;font-weight:600;color:var(--ink-dim);background:var(--panel);border:1px solid var(--line-strong);border-radius:8px;padding:8px 16px;cursor:pointer;transition:.18s}
  .tab:hover{color:var(--ink);border-color:var(--ember)}
  .tab.on{color:var(--ink);background:var(--panel2);border-color:var(--ember);box-shadow:inset 0 0 0 1px var(--ember)}

  main{padding-top:14px}
  .sec{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:12px;margin:14px 0;overflow:hidden;box-shadow:var(--shadow)}
  .sec-head{display:flex;align-items:center;gap:13px;padding:15px 17px;cursor:pointer;user-select:none;border-left:3px solid transparent;transition:.2s}
  .sec-head:hover{background:rgba(200,132,46,.05)}
  .chev{flex:0 0 auto;color:var(--ink-dim);transition:transform .25s;font-size:13px}
  .sec.open .chev{transform:rotate(90deg);color:var(--ember)}
  .sec-title{flex:1 1 auto;min-width:0}
  .sec-title .t{font-family:"Plus Jakarta Sans",system-ui,-apple-system,sans-serif;font-weight:600;letter-spacing:.04em;font-size:15.5px}
  .sec-title .s{font-size:12.5px;font-style:italic;color:var(--ink-dim);margin-top:2px}
  .maplink{display:inline-flex;align-items:center;gap:5px;margin-top:4px;font-size:11.5px;color:var(--ember);text-decoration:none;border-bottom:1px dotted var(--ember);padding-bottom:1px}
  .maplink svg{width:12px;height:12px;fill:none;stroke:var(--ember);stroke-width:1.8;stroke-linejoin:round}
  .maplink:hover{color:var(--ink);border-color:var(--ink)}
  .lvl{flex:0 0 auto;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ember);border:1px solid rgba(200,132,46,.3);border-radius:20px;padding:3px 9px;white-space:nowrap}
  .mini{flex:0 0 auto;font-size:12px;color:var(--ink-dim);font-variant-numeric:tabular-nums;min-width:46px;text-align:right}

  .sec-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s ease}
  .sec.open .sec-body{grid-template-rows:1fr}
  .sec-inner{overflow:hidden}
  .pbar{height:4px;background:#000;margin:0 17px}
  .pfill{height:100%;width:0;background:linear-gradient(90deg,var(--blood),var(--ember));transition:width .4s}

  .grp{padding:4px 14px 2px}
  .grp-h{font-family:"Plus Jakarta Sans",system-ui,-apple-system,sans-serif;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);margin:14px 0 5px;display:flex;align-items:center;gap:8px}
  .grp-h::after{content:"";flex:1;height:1px;background:var(--line)}

  /* atomic row: [check] [TYPE tag] [name + detail] */
  .row{display:flex;align-items:flex-start;gap:11px;padding:7px 6px;border-radius:8px;transition:.15s}
  .row:hover{background:rgba(255,255,255,.018)}
  .cb{flex:0 0 auto;width:19px;height:19px;margin-top:1px;border-radius:5px;cursor:pointer;border:1.5px solid var(--ink-faint);background:#0b0908;position:relative;transition:.15s}
  .cb:hover{border-color:var(--ember)}
  .cb.on{border-color:var(--blood);background:linear-gradient(135deg,var(--blood),var(--blood-deep))}
  .cb.on::after{content:"";position:absolute;left:5.5px;top:1.5px;width:5px;height:10px;border:solid #f4e6c8;border-width:0 2.4px 2.4px 0;transform:rotate(42deg)}
  .tag{flex:0 0 auto;width:88px;text-align:center;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;margin-top:3px;padding:3px 0;border-radius:4px;font-weight:600}
  .txt{flex:1 1 auto;min-width:0}
  .txt .l{font-size:15.5px}
  .txt .m{font-size:13px;color:var(--ink-dim);margin-top:1px}
  .txt .m b{color:var(--ember);font-weight:500}
  .row.done .l{color:var(--ink-faint);text-decoration:line-through;text-decoration-color:rgba(168,33,28,.6)}
  .row.done .m{opacity:.5}
  .row.done .tag{opacity:.45}

  .t-quest{color:#e7c98a;background:rgba(200,132,46,.12);border:1px solid rgba(200,132,46,.3)}
  .t-side{color:#8fb8e8;background:rgba(90,140,210,.14);border:1px solid rgba(90,140,210,.36)}
  .t-stronghold{color:#e89a8a;background:rgba(168,33,28,.13);border:1px solid rgba(168,33,28,.32)}
  .t-boss{color:#f0a0a0;background:rgba(168,33,28,.2);border:1px solid rgba(168,33,28,.45)}
  .t-waypoint{color:#6fc9ba;background:rgba(60,170,150,.13);border:1px solid rgba(60,170,150,.34)}
  .t-area{color:#b8c39a;background:rgba(140,160,90,.12);border:1px solid rgba(140,160,90,.3)}
  .t-altar{color:#d0a8d8;background:rgba(170,110,190,.12);border:1px solid rgba(170,110,190,.3)}
  .t-dungeon{color:#e6975a;background:rgba(205,110,45,.15);border:1px solid rgba(205,110,45,.38)}
  .t-cellar{color:#cdb27c;background:rgba(190,160,90,.13);border:1px solid rgba(190,160,90,.34)}
  .t-event{color:#a6abdd;background:rgba(120,128,210,.14);border:1px solid rgba(120,128,210,.36)}

  .callout{margin:6px 6px 4px;padding:10px 13px;border-radius:8px;font-size:13px;background:rgba(200,132,46,.06);border:1px solid rgba(200,132,46,.22);color:var(--ink-dim);font-style:italic}
  .callout b{color:var(--ember);font-style:normal}
  .pending{margin:6px;padding:11px 13px;border-radius:8px;border:1px dashed var(--line-strong);background:repeating-linear-gradient(45deg,rgba(0,0,0,.15),rgba(0,0,0,.15) 8px,transparent 8px,transparent 16px);font-size:12.5px;color:var(--ink-faint);font-style:italic}
  .pending b{color:var(--ink-dim);font-style:normal}

  footer{max-width:860px;margin:30px auto 0;padding:18px;font-size:12.5px;color:var(--ink-faint);text-align:center;border-top:1px solid var(--line);font-style:italic}

  .ov{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:50;backdrop-filter:blur(3px)}
  .ov.show{display:flex}
  .modal{background:var(--panel2);border:1px solid var(--line-strong);border-radius:12px;padding:22px;max-width:340px;text-align:center;box-shadow:var(--shadow)}
  .modal p{margin:0 0 16px;font-size:15px}
  .modal .m-row{display:flex;gap:10px;justify-content:center}
  .modal.wide{max-width:520px;width:92vw;text-align:left}
  .modal.wide p{font-size:13.5px;line-height:1.5;color:var(--ink-dim)}
  .modal textarea{width:100%;height:168px;resize:vertical;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;line-height:1.45;color:var(--ink);background:var(--panel);border:1px solid var(--line-strong);border-radius:8px;padding:10px;margin-bottom:12px;box-sizing:border-box}
  .modal textarea:focus{outline:none;border-color:var(--ember)}
  .bkmsg{margin:10px 0 0;min-height:16px;font-size:12.5px;text-align:center;color:var(--ink)}
  .l .drop{display:inline-block;margin-left:8px;font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:#e6b07a;background:rgba(230,151,90,.12);border:1px solid rgba(230,151,90,.4);border-radius:999px;padding:1px 7px;vertical-align:middle;white-space:nowrap}
  .l .bug{display:inline-block;margin-left:8px;font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:#f0a0a0;background:rgba(240,120,120,.12);border:1px solid rgba(240,120,120,.45);border-radius:999px;padding:1px 7px;vertical-align:middle;white-space:nowrap}
  .alert{margin:8px 0;padding:11px 13px;border:1px solid rgba(230,120,90,.5);border-left:3px solid #e0785a;border-radius:8px;background:rgba(224,120,90,.10);color:var(--ink);font-size:13px;line-height:1.55}
  .divider{display:flex;align-items:center;gap:10px;margin:18px 4px 8px;color:var(--ember);font-size:11px;letter-spacing:.07em;text-transform:uppercase;font-weight:700}
  .divider::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line-strong),transparent)}
  .suphead{display:flex;align-items:center;gap:12px;margin:24px 2px 12px;color:var(--ember);font-size:13px;letter-spacing:.18em;text-transform:uppercase;font-weight:800}
  .suphead:first-child{margin-top:6px}
  .suphead::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line-strong),transparent)}
  .flownote{margin:14px 2px 4px;padding:10px 12px;border:1px dashed var(--line-strong);border-radius:8px;color:var(--ink-dim);font-size:12.5px;line-height:1.5}
  .mrow{display:flex;flex-wrap:wrap;gap:4px 0;margin:4px 0 2px}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--ink-dim);line-height:1.4}
  .pill+.pill{margin-left:8px}
  .pill svg{width:11px;height:11px;flex:0 0 auto;fill:none;stroke:var(--ember);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .alert b{color:#f0b49a}
  .loading{text-align:center;padding:60px 20px;color:var(--ink-dim);font-style:italic;font-size:15px}
  .loading .flame{font-size:30px;animation:flick 1.4s infinite alternate}
  @keyframes flick{from{opacity:.4;transform:scale(.95)}to{opacity:1;transform:scale(1.05)}}
</style>

<header>
  <div class="hbar">
    <h1>Diablo IV — 100% Path</h1>
    <div class="hbar-right">
      <div class="save" id="save"><span class="dot"></span><span id="saveTxt">Loading…</span></div>
      <div class="menu-wrap">
        <button class="ham" id="hamBtn" aria-label="Menu" aria-expanded="false"><span></span><span></span><span></span></button>
        <div class="menu" id="menu" hidden>
          <button class="menu-item" id="backupBtn">Backup</button>
          <button class="menu-item" id="restoreBtn">Restore</button>
          <button class="menu-item danger" id="resetBtn">Reset progress</button>
        </div>
      </div>
    </div>
  </div>
  <div class="overall">
    <div class="obar"><div class="ofill" id="ofill"></div></div>
    <div class="ometa"><span id="oCount">—</span><span id="oPct">0%</span></div>
  </div>
  <div class="tabs" id="tabs">
    <button class="tab on" data-tab="campaign">1 · Campaign</button>
    <button class="tab" data-tab="regions">2 · Regions</button>
  </div>
</header>

<main class="wrap" id="app">
  <div class="loading"><div class="flame">🔥</div><div>Lighting the braziers…</div></div>
</main>

<footer>Base game (Prologue · Acts I–VI · Epilogue) · Vessel of Hatred (Nahantu) · Lord of Hatred coming soon · progress saves automatically and persists after you close the app.</footer>

<div class="ov" id="ov">
  <div class="modal">
    <p id="ovMsg">Reset all progress?</p>
    <div class="m-row"><button class="btn" id="ovNo">Cancel</button><button class="btn danger" id="ovYes">Yes, reset</button></div>
  </div>
</div>

<div class="ov" id="bk">
  <div class="modal wide">
    <p id="bkTitle"></p>
    <textarea id="bkText" spellcheck="false"></textarea>
    <div class="m-row"><button class="btn" id="bkClose">Close</button><button class="btn" id="bkAction"></button></div>
    <p id="bkMsg" class="bkmsg"></p>
  </div>
</div>

<script>
/* ===== DATA — atomic named items. type => tag. Verified only; gaps flagged. ===== */
const TAGLABEL={quest:"Quest",side:"Side Quest",waypoint:"Waypoint",dungeon:"Dungeon",stronghold:"Stronghold",boss:"World Boss",altar:"Altar",area:"Area",cellar:"Cellar",event:"Event"};
const DATA=[
  {
    id:"prologue", head:"Base Game", title:"Prologue — “Wandering”", sub:"8 campaign quests · Nevesk → Kyovashad", lvl:"Lvl 1",

        {id:"q-rite", type:"quest", name:"Rite of Passage", m:"The cleansing ritual at <b>Kyovashad's</b> gate (Lorath)."},

      {h:"Act II — “The Knife Twists Again”", items:[

/* ===== PERSISTENCE (window.storage — survives app close) ===== */
const KEY="d4_completion_state_v1";
let state={}, saveTimer=null;
const saveEl=document.getElementById("save"), saveTxt=document.getElementById("saveTxt");
function setSave(m){saveEl.className="save"+(m==="ok"?" ok":m==="busy"?" busy":"");saveTxt.textContent=m==="ok"?"Saved":m==="busy"?"Saving…":"Not saved";}
/* Persist via localStorage (works on any real URL incl. GitHub Pages).
   Falls back to window.storage when running inside the Claude artifact preview. */
const hasLS=(()=>{try{const k="__d4t";localStorage.setItem(k,"1");localStorage.removeItem(k);return true;}catch(e){return false;}})();
async function loadState(){
  try{
    if(hasLS){const v=localStorage.getItem(KEY);if(v)state=JSON.parse(v)||{};return;}
    const r=await window.storage.get(KEY);if(r&&r.value)state=JSON.parse(r.value)||{};
  }catch(e){state={};}
}
async function persist(){
  setSave("busy");
  try{
    if(hasLS){localStorage.setItem(KEY,JSON.stringify(state));setSave("ok");return;}
    await window.storage.set(KEY,JSON.stringify(state));setSave("ok");
  }catch(e){setSave("idle");}
}
function queueSave(){clearTimeout(saveTimer);saveTimer=setTimeout(persist,400);}

/* ===== EXPANSION TABS ===== */
const CAMPAIGN_IDS=new Set(["prologue","acts16","epilogue2","vohcampaign","vohepilogue","lohcampaign"]);
function partOf(id){return CAMPAIGN_IDS.has(id)?"campaign":"regions";}
let activeTab="campaign";
function tabRegions(){return DATA.filter(s=>partOf(s.id)===activeTab);}

/* ===== COUNTING (only checkable rows: have type+name, not callout/pending) ===== */
function isCheckable(it){return it.type&&it.name&&!it.callout&&!it.pending;}
function secItems(sec){return sec.groups.flatMap(g=>g.items||[]).filter(isCheckable);}
function counts(sec){const it=secItems(sec);return{done:it.filter(x=>state[x.id]).length,total:it.length};}
function overall(){let d=0,t=0;tabRegions().forEach(s=>{const c=counts(s);d+=c.done;t+=c.total;});return{d,t};}

/* ===== RENDER ===== */
const app=document.getElementById("app");
function render(){
  app.innerHTML="";
  const regions=tabRegions();
  const fn=document.createElement("div");fn.className="flownote";
  fn.textContent=activeTab==="campaign"
    ?"Part 1 — play the campaigns in release order: Base Game → Vessel of Hatred → Lord of Hatred."
    :"Part 2 — do this AFTER finishing all campaigns: the post-campaign state unlocks (and un-bugs) most side quests, dungeons, and open-world content.";
  app.appendChild(fn);
  if(!regions.length){app.innerHTML='<div class="loading">Skovos (Lord of Hatred) has not been added yet — coming soon.</div>';updateTotals();return;}
  regions.forEach((sec,i)=>{
    if(sec.head){const sh=document.createElement("div");sh.className="suphead";sh.innerHTML="<span>"+sec.head+"</span>";app.appendChild(sh);}
    const c=counts(sec), open=false;
    const el=document.createElement("section");el.className="sec"+(open?" open":"");
    const head=document.createElement("div");head.className="sec-head";
    head.innerHTML=`<span class="chev">▶</span><div class="sec-title"><div class="t">${sec.title}</div>${sec.mapurl?`<a class="maplink" href="${sec.mapurl}" target="_blank" rel="noopener" onclick="event.stopPropagation()"><svg viewBox="0 0 24 24"><path d="M9 3 3 5.5v15L9 18l6 3 6-2.5v-15L15 6 9 3z"/><path d="M9 3v15M15 6v15"/></svg>view quest map</a>`:""}</div>${sec.lvl?`<span class="lvl">${sec.lvl}</span>`:""}<span class="mini" data-mini="${sec.id}">${c.done}/${c.total}</span>`;
    head.addEventListener("click",()=>el.classList.toggle("open"));el.appendChild(head);
    const pbar=document.createElement("div");pbar.className="pbar";
    pbar.innerHTML=`<div class="pfill" data-pfill="${sec.id}" style="width:${c.total?c.done/c.total*100:0}%"></div>`;el.appendChild(pbar);
    const body=document.createElement("div");body.className="sec-body";
    const inner=document.createElement("div");inner.className="sec-inner";
    sec.groups.forEach(g=>{
      const grp=document.createElement("div");grp.className="grp";
      if(g.h)grp.innerHTML=`<div class="grp-h">${g.h}</div>`;
      (g.items||[]).forEach(it=>{
        if(it.callout){const d=document.createElement("div");d.className="callout";d.innerHTML=it.callout;grp.appendChild(d);return;}
        if(it.pending){const d=document.createElement("div");d.className="pending";d.innerHTML="⚒ "+it.pending;grp.appendChild(d);return;}
        if(it.div){const d=document.createElement("div");d.className="divider";d.innerHTML="<span>"+it.div+"</span>";grp.appendChild(d);return;}
        if(it.alert){const d=document.createElement("div");d.className="alert";d.innerHTML="⚠ "+it.alert;grp.appendChild(d);return;}
        const on=!!state[it.id];
        const row=document.createElement("div");row.className="row"+(on?" done":"");row.dataset.row=it.id;
        row.innerHTML=`<div class="cb ${on?"on":""}" data-cb="${it.id}"></div><span class="tag t-${it.type}">${TAGLABEL[it.type]}</span><div class="txt"><div class="l">${it.name}${it.drop?' <span class="drop" title="Starts from a random world item drop — no NPC quest giver">🎲 drop</span>':''}${it.bug?' <span class="bug" title="'+(it.bugmsg||'Known to bug for some players — relog or clear nearby world events if it won\'t start or progress')+'">⚠ can bug</span>':''}</div>${(it.loc||it.npc||it.chain)?'<div class="mrow">'+(it.loc?'<span class="pill"><svg viewBox="0 0 24 24"><path d="M12 21c-4-4.2-6-7.3-6-10a6 6 0 1 1 12 0c0 2.7-2 5.8-6 10z"/><circle cx="12" cy="11" r="2.3"/></svg>'+it.loc+'</span>':'')+(it.npc?'<span class="pill"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5.5 19.5c1.3-3.2 3.8-4.8 6.5-4.8s5.2 1.6 6.5 4.8"/></svg>'+it.npc+'</span>':'')+(it.chain?'<span class="pill"><svg viewBox="0 0 24 24"><path d="M4 7v5a4 4 0 0 0 4 4h11"/><path d="M15 12l4 4-4 4"/></svg>'+it.chain+'</span>':'')+'</div>':''}${it.m?`<div class="m">${it.m}</div>`:""}</div>`;
        row.querySelector(".cb").addEventListener("click",()=>toggle(it.id));
        grp.appendChild(row);
      });
      if(g.pending){const d=document.createElement("div");d.className="pending";d.innerHTML="⚒ "+g.pending;grp.appendChild(d);}
      inner.appendChild(grp);
    });
    body.appendChild(inner);el.appendChild(body);app.appendChild(el);
  });
  updateTotals();
}
function toggle(id){
  state[id]=!state[id];if(!state[id])delete state[id];
  const on=!!state[id];
  const cb=document.querySelector(`[data-cb="${id}"]`);
  if(cb){cb.classList.toggle("on",on);const row=cb.closest(".row");row.classList.toggle("done",on);}
  DATA.forEach(sec=>{const c=counts(sec);const mini=document.querySelector(`[data-mini="${sec.id}"]`);const pf=document.querySelector(`[data-pfill="${sec.id}"]`);if(mini)mini.textContent=`${c.done}/${c.total}`;if(pf)pf.style.width=(c.total?c.done/c.total*100:0)+"%";});
  updateTotals();queueSave();
}
function updateTotals(){const{d,t}=overall();const p=t?Math.round(d/t*100):0;document.getElementById("ofill").style.width=p+"%";document.getElementById("oCount").textContent=`${d} of ${t} tracked items`;document.getElementById("oPct").textContent=p+"%";}

document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>{activeTab=b.dataset.tab;document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x===b));render();}));
const ov=document.getElementById("ov");
document.getElementById("resetBtn").addEventListener("click",()=>ov.classList.add("show"));
document.getElementById("ovNo").addEventListener("click",()=>ov.classList.remove("show"));
document.getElementById("ovYes").addEventListener("click",async()=>{state={};ov.classList.remove("show");render();await persist();});

/* ===== HAMBURGER MENU ===== */
const hamBtn=document.getElementById("hamBtn"),menu=document.getElementById("menu");
function closeMenu(){menu.hidden=true;hamBtn.classList.remove("on");hamBtn.setAttribute("aria-expanded","false");}
function openMenu(){menu.hidden=false;hamBtn.classList.add("on");hamBtn.setAttribute("aria-expanded","true");}
hamBtn.addEventListener("click",e=>{e.stopPropagation();menu.hidden?openMenu():closeMenu();});
menu.addEventListener("click",e=>e.stopPropagation());
document.querySelectorAll(".menu-item").forEach(b=>b.addEventListener("click",closeMenu));
document.addEventListener("click",closeMenu);
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeMenu();});

/* ===== BACKUP / RESTORE (copy & paste — works inside the app sandbox) ===== */
const bk=document.getElementById("bk"),bkTitle=document.getElementById("bkTitle"),bkText=document.getElementById("bkText"),bkAction=document.getElementById("bkAction"),bkMsg=document.getElementById("bkMsg");
let bkMode="backup";
function openBackup(){
  bkMode="backup";
  bkTitle.innerHTML="<b>Backup.</b> Here is your progress as text. Tap <b>Copy</b>, then paste it into a note, email to yourself, or a text file to keep it safe.";
  bkText.value=JSON.stringify({app:"d4-completion",key:KEY,saved:new Date().toISOString(),checks:state});
  bkText.readOnly=true;bkAction.textContent="Copy";bkMsg.textContent="";
  bk.classList.add("show");setTimeout(()=>{bkText.focus();bkText.select();},60);
}
function openRestore(){
  bkMode="restore";
  bkTitle.innerHTML="<b>Restore.</b> Paste a backup below and tap <b>Restore</b>. This only adds checkmarks — it never removes any.";
  bkText.value="";bkText.readOnly=false;bkAction.textContent="Restore";bkMsg.textContent="";
  bk.classList.add("show");setTimeout(()=>bkText.focus(),60);
}
function closeBk(){bk.classList.remove("show");}
document.getElementById("backupBtn").addEventListener("click",openBackup);
document.getElementById("restoreBtn").addEventListener("click",openRestore);
document.getElementById("bkClose").addEventListener("click",closeBk);
bk.addEventListener("click",e=>{if(e.target===bk)closeBk();});
bkAction.addEventListener("click",async()=>{
  if(bkMode==="backup"){
    bkText.focus();bkText.select();
    let ok=false;
    try{ok=document.execCommand("copy");}catch(e){}
    if(!ok&&navigator.clipboard){try{await navigator.clipboard.writeText(bkText.value);ok=true;}catch(e){}}
    bkMsg.textContent=ok?"Copied ✓  — now paste it somewhere safe.":"Select the text above, then copy it (Ctrl/Cmd+A, Ctrl/Cmd+C).";
  }else{
    let data;
    try{data=JSON.parse(bkText.value.trim());}catch(e){bkMsg.textContent="That isn't valid backup text — paste the full thing you copied.";return;}
    const checks=(data&&data.checks&&typeof data.checks==="object")?data.checks:((data&&typeof data==="object")?data:null);
    if(!checks){bkMsg.textContent="Couldn't find any progress in that text.";return;}
    let added=0;Object.keys(checks).forEach(k=>{if(checks[k]&&!state[k]){state[k]=true;added++;}});
    render();await persist();
    bkMsg.textContent=added?("Restored "+added+" item"+(added===1?"":"s")+" ✓"):"Everything in that backup was already checked ✓";
  }
});

(async function(){await loadState();render();setSave("ok");})();
</script>
